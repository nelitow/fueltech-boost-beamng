name: Sunburst2 EJ Engines Release

on:
  push:
    branches: [master]
    paths:
      - 'sunburst2_ej_engines/**'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from info.json
        id: version
        run: |
          VER=$(grep -oP '"version_string":\s*"\K[\d]+\.[\d]+\.[\d]+' sunburst2_ej_engines/mod_info/sunburst2_ej_engines/info.json | head -1)
          echo "version=sunburst2-ej-v$VER" >> "$GITHUB_OUTPUT"
          echo "Found version: v$VER"

      - name: Check if release already exists
        id: check
        run: |
          if gh release view "${{ steps.version.outputs.version }}" &>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate changelog
        if: steps.check.outputs.exists == 'false'
        id: changelog
        run: |
          PREV_TAG=$(gh release list --limit 50 --json tagName -q '[.[].tagName | select(startswith("sunburst2-ej-v"))][0]' 2>/dev/null || true)
          if [ -z "$PREV_TAG" ]; then
            LOG=$(git log --pretty=format:"- %s (%h)" --no-merges -- sunburst2_ej_engines)
          else
            LOG=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges -- sunburst2_ej_engines)
          fi

          {
            echo "# Sunburst2 EJ255/EJ257 Engine Tunes ${{ steps.version.outputs.version }}"
            echo ""
            echo "Realistic Subaru EJ255 (WRX) / EJ257 (STI) engine and drivetrain builds for the Hirochi Sunburst2."
            echo ""
            echo "## Installation"
            echo "1. Download \`sunburst2_ej_engines.zip\` below"
            echo "2. Extract into \`%LocalAppData%\\BeamNG\\BeamNG.drive\\<version>\\mods\\unpacked\\\`"
            echo "3. Pick the new parts from Vehicle Config > Engine/Drivetrain on the Sunburst2"
            echo ""
            echo "## Changelog"
            echo "$LOG"
          } > release_notes.md

          cat release_notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create mod zip
        if: steps.check.outputs.exists == 'false'
        run: |
          mkdir -p dist
          cd sunburst2_ej_engines
          zip -r ../dist/sunburst2_ej_engines.zip \
            vehicles/ \
            mod_info/ \
            README.md \
            -x "*.git*"

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            dist/sunburst2_ej_engines.zip \
            --title "Sunburst2 EJ Engines ${{ steps.version.outputs.version }}" \
            --notes-file release_notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
